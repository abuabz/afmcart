<style>
:root{
  --green:#1fa32a;
  --green-dark:#17802100;
  --btn:#178a21;
  --ink:#0a0a0a;
  --muted:#4d5b4f;
  --bg:#ffffff;
  --line:#cfe3d1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
}
/* cart icon background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{
  position:absolute;width:var(--s);height:calc(var(--s) * .6);left:var(--x);top:var(--y);
  fill:var(--green);opacity:.08;animation:float var(--t) ease-in-out infinite;animation-delay:var(--d);
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(var(--r))}
  50%{transform:translateY(-22px) rotate(calc(var(--r) + 6deg))}
}
main{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px clamp(20px,5vw,56px) 40px;
}
/* logo cart: rolls in slowly, then bobs */
.hero-cart{
  width:clamp(170px,34vw,300px);height:auto;margin-bottom:6px;
  animation:drive 2.6s cubic-bezier(.25,.6,.3,1) both, bob 3s ease-in-out 2.6s infinite;
}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.6s cubic-bezier(.25,.6,.3,1) both}
@keyframes drive{
  from{transform:translateX(-70vw);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes spin{from{transform:rotate(-540deg)}to{transform:rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{
  line-height:0;
  display:flex;justify-content:center;
  animation:zoomIn 1.4s 1.4s cubic-bezier(.16,1,.3,1) both;
}
h1 img{display:block;width:clamp(290px,60vw,620px);height:auto}
@keyframes zoomIn{
  from{transform:scale(.4);opacity:0;filter:blur(12px)}
  to{transform:scale(1);opacity:1;filter:blur(0)}
}
.soon{
  display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,28px);
  margin:34px 0 18px;width:100%;
}
.soon h2{
  font-weight:900;line-height:1;white-space:nowrap;
  font-size:clamp(1.9rem,7.2vw,4.4rem);
  background:linear-gradient(135deg,#25b631 0%,#137a1c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:reveal 1.6s 2.5s cubic-bezier(.16,1,.3,1) both;
}
.soon .line{
  height:4px;border-radius:4px;background:var(--green);
  width:clamp(24px,8vw,110px);
  animation:grow 1.2s 3s cubic-bezier(.16,1,.3,1) both;
}
.soon .line:first-child{transform-origin:right}
.soon .line:last-child{transform-origin:left}
@keyframes reveal{
  from{opacity:0;letter-spacing:.35em;transform:scale(.9)}
  to{opacity:1;letter-spacing:-.01em;transform:scale(1)}
}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sub{
  margin:0;max-width:32rem;color:var(--muted);
  font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.55;
}
.contact{
  margin-top:36px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center;
  font-weight:600;font-size:1rem;
}
.contact a,.contact span{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.contact a:hover{color:var(--btn);text-decoration:underline}
.contact svg{width:20px;height:20px;fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.contact a:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
footer{position:relative;z-index:1;padding:20px;text-align:center;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
